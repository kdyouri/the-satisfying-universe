# Install after a certificate exists and the owner has accepted the CA's terms.
log_format studio_safe '$remote_addr $request_method $uri $status';
limit_req_zone $binary_remote_addr zone=studio_login:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name studio.technoinno.live;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/technoinno-acme;
        try_files $uri =404;
    }
    location / { return 301 https://studio.technoinno.live$uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.technoinno.live;
    server_tokens off;
    proxy_headers_hash_bucket_size 128;
    ssl_certificate /etc/letsencrypt/live/studio.technoinno.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.technoinno.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/technoinno-access.log studio_safe;
    # Proxy connection errors can contain OAuth callback URLs; omit their query strings
    # by avoiding request-level error logging here. Application errors are logged safely.
    error_log /var/log/nginx/technoinno-error.log crit;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /login {
        limit_req zone=studio_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auth/youtube/callback {
        # Never let an upstream diagnostic log an authorization-code query string.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
