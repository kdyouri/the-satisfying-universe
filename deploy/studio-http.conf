# Install only after owner approval. Initial public HTTP serves ACME challenges only.
server {
    listen 80;
    listen [::]:80;
    server_name studio.technoinno.live;
    access_log off;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/technoinno-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
