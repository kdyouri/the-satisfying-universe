[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "the-satisfying-universe"
version = "0.1.0"
description = "Durable, cost-controlled AI video production"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.8", "pydantic-settings==2.16.2",
  "celery[redis]==5.6.3", "alembic==1.20.1", "httpx==0.28.1", "tzdata==2026.6",
  "google-auth-oauthlib==1.5.0", "cryptography==50.0.2"
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["tsu*"]

[tool.setuptools.package-data]
tsu = ["admin.html", "assets/*.wav", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TSU_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
