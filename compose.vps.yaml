# Fresh 1 GB / 1 CPU VPS profile. Start only `api` during OAuth onboarding.
services:
  postgres:
    mem_limit: 192m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    mem_limit: 96m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
  api:
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  worker:
    profiles: [production]
    mem_limit: 512m
    command: ["celery", "-A", "tsu.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
  beat:
    profiles: [production]
    mem_limit: 128m
